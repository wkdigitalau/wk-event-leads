name: Probe WK Digital Insights runtime

on:
  push:
    paths:
      - ".github/workflows/probe-insights-runtime.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Insights runtime (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: 149.28.165.62
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -eu
            WP_ROOT="/var/www/wkdigital.com.au"
            wp eval '
              echo "class=" . (class_exists("WKEL_Insights") ? "present" : "missing") . PHP_EOL;
              echo "ga4=" . (defined("WKEL_GA4_PROPERTY_ID") ? "defined" : "missing") . PHP_EOL;
              echo "search=" . (defined("WKEL_SEARCH_CONSOLE_SITE_URL") ? "defined" : "missing") . PHP_EOL;
              echo "service=" . (defined("WKEL_GOOGLE_SERVICE_ACCOUNT_JSON") ? "defined" : "missing") . PHP_EOL;
              if (class_exists("WKEL_Insights")) {
                $m = new ReflectionMethod("WKEL_Insights", "google_metrics");
                $m->setAccessible(true);
                $result = $m->invoke(null, 30);
                if (is_wp_error($result)) {
                  echo "google-result=error:" . $result->get_error_code() . ":" . $result->get_error_message() . PHP_EOL;
                } else {
                  echo "google-result=configured:" . (!empty($result["configured"]) ? "true" : "false") . PHP_EOL;
                  echo "ga4-active-users=" . ($result["ga4"]["active_users"] ?? "missing") . PHP_EOL;
                  echo "search-clicks=" . ($result["search"]["clicks"] ?? "missing") . PHP_EOL;
                }
              }
            ' --path="$WP_ROOT" --allow-root --skip-themes
