name: Plugin lint

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
      - name: Check PHP syntax
        run: find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: find assets/js -type f -name "*.js" -print0 | xargs -0 -n1 node --check
