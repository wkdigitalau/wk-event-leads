name: Deploy Event Leads plugin

on:
  workflow_dispatch:
    inputs:
      site:
        description: Approved deployment target
        required: true
        type: choice
        options: [connect, cofo, wkdigital]
      expected_version:
        description: Plugin version to deploy (for example 1.4.3)
        required: true
        type: string
      approved:
        description: Production deployment has been explicitly approved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wkel-deploy-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.approved && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.site }}-production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SITE: ${{ inputs.site }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - name: Validate version and isolated deployment configuration
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_KEY" && test -n "$DEPLOY_PATH"
          [[ "$DEPLOY_PATH" = /*/wp-content/plugins/wk-event-leads ]] || exit 1
      - name: Check out the exact reviewed workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build and verify the release package on the runner
        run: |
          set -euo pipefail
          python3 scripts/build-release.py
          VERSION="$(sed -n "s/.*define('WKEL_VERSION',[[:space:]]*'\([^']*\)'.*/\1/p" wk-event-leads.php)"
          test -n "$VERSION" && test "$VERSION" = "$EXPECTED_VERSION"
          ARCHIVE="dist/wk-event-leads-$VERSION.zip"
          test -s "$ARCHIVE"
          unzip -q "$ARCHIVE" -d release-stage
          test -s release-stage/wk-event-leads/wk-event-leads.php
          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner -czf wkel-release.tar.gz -C release-stage/wk-event-leads .
          sha256sum wkel-release.tar.gz > wkel-release.tar.gz.sha256
          echo "Built version $VERSION from commit $GITHUB_SHA"
          sha256sum "$ARCHIVE" wkel-release.tar.gz
      - name: Back up the selected site's database, configuration and plugin
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: DEPLOY_PATH,DEPLOY_SITE
          script: |
            set -eu
            PLUGIN="$(realpath "$DEPLOY_PATH")"
            case "$PLUGIN" in /*/wp-content/plugins/wk-event-leads) ;; *) exit 1 ;; esac
            WP_ROOT="$(dirname "$(dirname "$(dirname "$PLUGIN")")")"
            test -f "$WP_ROOT/wp-config.php" && test -d "$PLUGIN"
            command -v wp >/dev/null
            case "$DEPLOY_SITE" in connect) EXPECTED=https://connect.digitalp.com.au;; cofo) EXPECTED=https://cofopartners.com;; wkdigital) EXPECTED=https://wkdigital.com.au;; *) exit 1 ;; esac
            SITE_URL="$(wp option get home --path="$WP_ROOT" --allow-root)"
            test "${SITE_URL%/}" = "$EXPECTED"
            BACKUP_DIR="$HOME/wkel-backups/$DEPLOY_SITE/$(date -u +%Y%m%dT%H%M%SZ)"
            install -d -m 700 "$BACKUP_DIR"
            wp db export "$BACKUP_DIR/database.sql" --path="$WP_ROOT" --allow-root
            tar -czf "$BACKUP_DIR/plugin.tar.gz" -C "$(dirname "$PLUGIN")" wk-event-leads
            cp "$WP_ROOT/wp-config.php" "$BACKUP_DIR/wp-config.php"
            test -s "$BACKUP_DIR/database.sql" && test -s "$BACKUP_DIR/plugin.tar.gz" && test -s "$BACKUP_DIR/wp-config.php"
            chmod 600 "$BACKUP_DIR/"*
            tar -tzf "$BACKUP_DIR/plugin.tar.gz" >/dev/null
            printf 'Verified backup: %s\n' "$BACKUP_DIR"
      - name: Upload release without replacing configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          source: wkel-release.tar.gz,wkel-release.tar.gz.sha256
          target: ${{ env.DEPLOY_PATH }}/.wkel-release
      - name: Install verified package with dry-run and test mode enabled
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: DEPLOY_PATH,DEPLOY_SITE
          script: |
            set -eu
            PLUGIN="$(realpath "$DEPLOY_PATH")"
            case "$PLUGIN" in /*/wp-content/plugins/wk-event-leads) ;; *) exit 1 ;; esac
            WP_ROOT="$(dirname "$(dirname "$(dirname "$PLUGIN")")")"
            cd "$PLUGIN/.wkel-release"
            sha256sum -c wkel-release.tar.gz.sha256
            tar -xzf wkel-release.tar.gz -C "$PLUGIN"
            find "$PLUGIN" -type f -not -path '*/.wkel-release/*' -exec chmod 644 {} +
            find "$PLUGIN" -type d -exec chmod 755 {} +
            # Refresh PHP mtimes so PHP-FPM OPcache detects this deployment.
            find "$PLUGIN" -type f -name '*.php' -not -path '*/.wkel-release/*' -exec touch {} +
            test "$(stat -c %Y "$PLUGIN/includes/class-wkel-outreach.php")" -gt "$(date -d '1 minute ago' +%s)"
            grep -Fq 'Enable allowlisted test sending' "$PLUGIN/includes/class-wkel-outreach.php"
            grep -Fq 'Test recipient email addresses' "$PLUGIN/includes/class-wkel-outreach.php"
            wp option update wkel_outreach_dry_run 1 --path="$WP_ROOT" --allow-root
            wp option update wkel_outreach_enabled 1 --path="$WP_ROOT" --allow-root
            wp option update wkel_outreach_test_mode 1 --path="$WP_ROOT" --allow-root
            wp eval '
              if (!class_exists("WKEL_Outreach")) { throw new RuntimeException("WKEL_Outreach did not load"); }
              $source = file_get_contents((new ReflectionClass("WKEL_Outreach"))->getFileName());
              if (!str_contains($source, "Enable allowlisted test sending") || !str_contains($source, "Test recipient email addresses")) throw new RuntimeException("New outreach controls did not load");
              echo "Loaded outreach code: test-only controls present" . PHP_EOL;
              echo "Installed WK Event Leads " . WKEL_VERSION . PHP_EOL;
            ' --path="$WP_ROOT" --allow-root
            echo "Installed shared release; dry-run and allowlisted test mode remain enabled."
