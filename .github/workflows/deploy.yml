name: Deploy WK Event Leads to wkdigital.com.au

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy plugin files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 149.28.165.62
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: "."
          target: "/var/www/vhosts/wkdigital.com.au/httpdocs/wp-content/plugins"
          strip_components: 1
          rm: false

      - name: Fix permissions
        uses: appleboy/ssh-action@v1
        with:
          host: 149.28.165.62
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -e
            PLUGIN_ROOT="/var/www/vhosts/wkdigital.com.au/httpdocs/wp-content/plugins"
            FILES=(
              "$PLUGIN_ROOT/wk-event-leads.php"
              "$PLUGIN_ROOT/uninstall.php"
            )
            DIRECTORIES=(
              "$PLUGIN_ROOT/assets"
              "$PLUGIN_ROOT/includes"
              "$PLUGIN_ROOT/languages"
              "$PLUGIN_ROOT/modules"
              "$PLUGIN_ROOT/templates"
            )
            for file in "${FILES[@]}"; do
              [ -f "$file" ] || continue
              chown www-data:www-data "$file"
              chmod 644 "$file"
            done
            for directory in "${DIRECTORIES[@]}"; do
              [ -d "$directory" ] || continue
              chown -R www-data:www-data "$directory"
              find "$directory" -type f -exec chmod 644 {} \;
              find "$directory" -type d -exec chmod 755 {} \;
            done
            echo "Deployed wk-event-leads at $(date)"
