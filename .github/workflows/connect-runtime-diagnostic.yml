name: Temporary Connect Runtime Diagnostic

on:
  workflow_dispatch:
    inputs:
      approved:
        description: Run read-only Connect diagnostics (no settings changes or email)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.approved }}
    runs-on: ubuntu-latest
    environment: connect-production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Validate Connect target and inspect installed code/runtime
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            PLUGIN="$(realpath "$DEPLOY_PATH")"
            case "$PLUGIN" in /*/wp-content/plugins/wk-event-leads) ;; *) exit 1 ;; esac
            WP_ROOT="$(dirname "$(dirname "$(dirname "$PLUGIN")")")"
            test -f "$WP_ROOT/wp-config.php"
            test "$(wp option get home --path="$WP_ROOT" --allow-root | sed 's:/*$::')" = "https://connect.digitalp.com.au"
            FILE="$PLUGIN/includes/class-wkel-outreach.php"
            test -f "$FILE"
            echo "Target site: Connect (domain check passed)"
            echo "Plugin directory resolves to configured deployment directory: yes"
            echo "Plugin file SHA-256:"
            sha256sum "$FILE"
            if grep -Fq 'Enable internal test sending' "$FILE" && grep -Fq 'Allowed test email addresses' "$FILE"; then
              echo "On-disk test controls: present"
            else
              echo "On-disk test controls: absent"
            fi
            echo "On-disk plugin version:"
            wp plugin get wk-event-leads --field=version --path="$WP_ROOT" --allow-root
            echo "WordPress CLI loaded class:"
            wp eval '
              if (!class_exists("WKEL_Outreach")) { echo "WKEL_Outreach class: absent" . PHP_EOL; exit(2); }
              $file = (new ReflectionClass("WKEL_Outreach"))->getFileName();
              $source = file_get_contents($file);
              echo "Class file basename: " . basename($file) . PHP_EOL;
              echo "Loaded class file SHA-256: " . hash_file("sha256", $file) . PHP_EOL;
              echo "Loaded class test controls: " . (str_contains($source, "Enable internal test sending") && str_contains($source, "Allowed test email addresses") ? "present" : "absent") . PHP_EOL;
            ' --path="$WP_ROOT" --allow-root
            if command -v php-fpm8.2 >/dev/null 2>&1; then
              echo "PHP-FPM OPcache configuration:"
              php-fpm8.2 -i 2>/dev/null | grep -E '^(opcache.enable|opcache.validate_timestamps|opcache.revalidate_freq) =>' || echo "OPcache values unavailable from php-fpm8.2 -i"
            else
              echo "PHP-FPM OPcache configuration: php-fpm8.2 binary unavailable"
            fi
