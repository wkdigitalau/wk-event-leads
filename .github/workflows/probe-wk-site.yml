name: Probe WK Digital WordPress roots

on:
  push:
    paths:
      - ".github/workflows/probe-wk-site.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect WordPress roots (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: 149.28.165.62
          username: root
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -eu
            found=0
            for candidate in /var/www/*/wp-config.php; do
              [ -f "$candidate" ] || continue
              found=1
              root="${candidate%/wp-config.php}"
              home=""
              site=""
              if command -v wp >/dev/null 2>&1; then
                home="$(wp option get home --path="$root" --allow-root --skip-plugins --skip-themes 2>/dev/null || true)"
                site="$(wp option get siteurl --path="$root" --allow-root --skip-plugins --skip-themes 2>/dev/null || true)"
              fi
              if [ -n "$home" ] || [ -n "$site" ]; then
                echo "$candidate | home=$home | siteurl=$site"
              else
                echo "$candidate"
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "No WordPress wp-config.php files found under /var/www"
            fi
