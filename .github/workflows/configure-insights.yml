name: Configure site Insights credentials

on:
  workflow_dispatch:
    inputs:
      site:
        description: Approved site configuration target
        required: true
        type: choice
        options: [connect]
      approved:
        description: Site configuration changes have been explicitly approved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wkel-deploy-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ inputs.approved && inputs.site == 'connect' }}
    runs-on: ubuntu-latest
    environment: connect-production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SITE: connect
      WKEL_INSIGHTS_SITE_URL: https://elitenursepartners.com.au
      WKEL_GA4_PROPERTY_ID: '556479100'
      WKEL_SEARCH_CONSOLE_SITE_URL: sc-domain:elitenursepartners.com.au
    steps:
      - name: Validate and encode ENP reporting key
        id: google_key
        env:
          ENP_GA4_SA_JSON: ${{ secrets.ENP_GA4_SA_JSON }}
        run: |
          set -euo pipefail
          test -n "$ENP_GA4_SA_JSON"
          printf '%s' "$ENP_GA4_SA_JSON" | python3 -c 'import json,sys; key=json.load(sys.stdin); assert key.get("type") == "service_account" and key.get("client_email") and key.get("private_key")'
          key_b64="$(printf '%s' "$ENP_GA4_SA_JSON" | base64 -w 0)"
          echo "::add-mask::$key_b64"
          echo "json_b64=$key_b64" >> "$GITHUB_OUTPUT"
      - name: Install this site's read-only Google configuration
        uses: appleboy/ssh-action@v1
        env:
          WKEL_GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ steps.google_key.outputs.json_b64 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_PATH,DEPLOY_SITE,WKEL_INSIGHTS_SITE_URL,WKEL_GOOGLE_SERVICE_ACCOUNT_JSON_B64,WKEL_GA4_PROPERTY_ID,WKEL_SEARCH_CONSOLE_SITE_URL
          script: |
            set -eu
            test -n "$WKEL_GOOGLE_SERVICE_ACCOUNT_JSON_B64"
            test -n "$WKEL_GA4_PROPERTY_ID" && test -n "$WKEL_SEARCH_CONSOLE_SITE_URL"
            PLUGIN="$(realpath "$DEPLOY_PATH")"
            case "$PLUGIN" in /*/wp-content/plugins/wk-event-leads) ;; *) exit 1 ;; esac
            WP_ROOT="$(dirname "$(dirname "$(dirname "$PLUGIN")")")"
            EXPECTED=https://connect.digitalp.com.au
            SITE_URL="$(wp option get home --path="$WP_ROOT" --allow-root)"
            test "${SITE_URL%/}" = "$EXPECTED"
            BACKUP_DIR="$HOME/wkel-backups/connect/$(date -u +%Y%m%dT%H%M%SZ)-config"
            install -d -m 700 "$BACKUP_DIR"
            wp db export "$BACKUP_DIR/database.sql" --path="$WP_ROOT" --allow-root
            cp "$WP_ROOT/wp-config.php" "$BACKUP_DIR/wp-config.php"
            tar -czf "$BACKUP_DIR/plugin.tar.gz" -C "$(dirname "$PLUGIN")" wk-event-leads
            chmod 600 "$BACKUP_DIR/"*
            TARGET_DIR="/var/lib/wkel-insights/connect"
            if [ -d "$TARGET_DIR" ]; then tar -czf "$BACKUP_DIR/insights.tar.gz" -C "$TARGET_DIR" .; chmod 600 "$BACKUP_DIR/insights.tar.gz"; fi
            install -d -m 750 "$TARGET_DIR"
            umask 077
            printf '%s' "$WKEL_GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > "$TARGET_DIR/google-readonly.json.new"
            python3 -c 'import json,sys; k=json.load(open(sys.argv[1])); assert k.get("type")=="service_account" and k.get("client_email") and k.get("private_key")' "$TARGET_DIR/google-readonly.json.new"
            mv "$TARGET_DIR/google-readonly.json.new" "$TARGET_DIR/google-readonly.json"
            chown root:www-data "$TARGET_DIR"
            chown www-data:www-data "$TARGET_DIR/google-readonly.json"
            chmod 600 "$TARGET_DIR/google-readonly.json"
            wp config set WKEL_INSIGHTS_SITE_URL "$WKEL_INSIGHTS_SITE_URL" --path="$WP_ROOT" --allow-root
            wp config set WKEL_GA4_PROPERTY_ID "$WKEL_GA4_PROPERTY_ID" --path="$WP_ROOT" --allow-root
            wp config set WKEL_SEARCH_CONSOLE_SITE_URL "$WKEL_SEARCH_CONSOLE_SITE_URL" --path="$WP_ROOT" --allow-root
            wp config set WKEL_GOOGLE_SERVICE_ACCOUNT_JSON "$TARGET_DIR/google-readonly.json" --path="$WP_ROOT" --allow-root
            echo 'ENP Google reporting configuration installed on Connect; credential remains outside the public web root.'
